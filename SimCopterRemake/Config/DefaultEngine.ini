[/Script/Engine.RendererSettings]
r.AllowStaticLighting=True
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=3
r.ReflectionMethod=2

r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True

; Off, for both graphics modes. Substrate's multi-closure G-buffer and its per-pixel tile
; classification buy layered and coated surfaces this project has none of: every material here is
; base colour, roughness, specular, emissive and a normal. Nothing in
; Tools/Unreal/CreateSimCopterMaterials.py uses a Substrate-only node, so the graphs are unchanged.
;
; MEASURED, so nobody re-measures the wrong thing: the materials' own instruction counts are
; IDENTICAL either way (atlas 382/172, terrain 452/158, water 369/187 pixel/vertex). The graph
; translates the same; the saving is in the G-buffer layout and the deferred shading passes around
; it, which MaterialEditingLibrary.get_statistics does not count. Changing this recompiles every
; shader in the project, so it is a restart, not a setting.
r.Substrate=False

; Only read while Substrate is on; left in place so re-enabling it above restores the same setup.
r.Substrate.ProjectGBufferFormat=0

r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.Lumen.HardwareRayTracing.LightingMode=0
r.MegaLights.EnableForProject=False
r.RayTracing.Shadows=False
r.Mobile.AntiAliasing=1
r.Mobile.ShadingPath=1
r.MobileHDR=True
r.Lumen.TraceMeshSDFs=0

; 1, not 0, because of the night windows. Lumen gathers light two ways and only one of them can be
; reached from a material: the surface cache (which the atlas material opts out of with
; `#ifdef LUMEN_CARD_CAPTURE`) and SCREEN TRACES, which sample the frame that was just drawn and so
; see the windows however the base pass drew them. No shader guard can touch that path. This is the
; one knob it has, and the engine's own text for it names the exact failure: 0 is "Scene Color (no
; translucency and noise from small emissive elements)", 1 is "Anti-aliased Scene Color ... less
; noise from small emissive elements". A skyline of 25-nit windows over ground at a fraction of a
; nit IS "small emissive elements". Reflections only (LumenReflectionTracing.cpp reads it and
; nothing else does), so the diffuse gather still sees them; if that ever has to go too, the lever
; is r.Lumen.ScreenProbeGather.ScreenTraces and it is a much blunter one.
r.Lumen.ScreenTracingSource=1
r.Lumen.Reflections.HardwareRayTracing.Translucent.Refraction.EnableForProject=True
r.RayTracing.UseTextureLod=False
r.PathTracing=True
r.Nanite.ProjectEnabled=True
r.AntiAliasingMethod=4
r.ForwardShading=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LightUnits=2
r.Shadow.UnbuiltPreviewInGame=True
r.Lumen.HardwareRayTracing=True
r.VirtualTexturedLightmaps=True

