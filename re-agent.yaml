# re-agent configuration for SimCopter decompilation.
# Docs: Docs/ReverseEngineeringToolkit.md
# Requires the ghidra-bridge export to exist (.ghidra-exports/) and a working
# Codex CLI ChatGPT login (`codex login status`) for the LLM loop.

project_profile:
  # Ported UE code marks its origin with: // SCHOOK: FunctionName 0x004abce0
  hook_patterns:
    - 'SCHOOK:\s*(\w+)\s+(0x[0-9A-Fa-f]+)'
  stub_patterns: []
  stub_markers: []
  stub_call_prefix: ""
  class_macro: ""
  source_root: "SimCopterRemake/Source"
  source_extensions: [".cpp", ".h"]

llm:
  # Default provider. Override per-run with `re-agent reverse --llm <choice>`:
  #   codex          -> Codex CLI (ChatGPT login), Sol at medium reasoning [default]
  #   fable / claude -> npm Claude Code CLI (subscription login),
  #                     model claude-fable-5 @ medium reasoning effort
  # The `--llm` presets also set `model`/`effort`, so this block only needs to
  # describe the default (codex) path.
  provider: "codex"
  model: "gpt-5.6-sol"
  # Reasoning effort for CLI providers. The Codex provider passes this as a
  # per-run `-c model_reasoning_effort=...` override.
  effort: "medium"
  max_tokens: 8192
  temperature: 0.0
  timeout_s: 1800

backend:
  type: "ghidra-bridge"
  # Use an absolute path. PowerShell can resolve the relative path, but re-agent's
  # Python subprocess launcher may not on Windows.
  cli_path: "S:/Repos/sim-copter-remake/Tools/re-agent/.venv/Scripts/ghidra-bridge.exe"
  timeout_s: 60

parity:
  enabled: true
  call_count_warn_diff: 3
  inline_wrapper_autoskip: false
  cache_dir: ".cache/re-agent-parity"

orchestrator:
  max_review_rounds: 4
  max_functions_per_class: 10
  objective_verifier_enabled: true
  objective_call_count_tolerance: 3
  objective_control_flow_tolerance: 2

output:
  # Durable candidate code and pass/fail state are tracked with the rest of the
  # reverse-engineering evidence. Raw prompt/checker/live logs stay local-only
  # under reports/re-agent/logs because they are large and noisy.
  report_dir: "Docs/scratchpad/re-agent"
  log_dir: "reports/re-agent/logs"
  session_file: "Docs/scratchpad/re-agent/re-agent-progress.json"
  format: "json"
