[/Script/Engine.CollisionProfile]
; One custom object channel, for the city's trees. Everything else in the world is
; ECC_WorldStatic, and a tree cannot be: the airframe has to hit one (FUN_0048ad50 answers a tile
; object with damage and a bounce) while nobody on foot may, and both the helicopter capsule and
; every pedestrian capsule are ECC_Pawn - so no response on the tree's side can tell them apart.
; Giving the trees their own object type does: the ground agents and the on-foot pilot ignore this
; channel, the helicopter blocks it like everything else.
; DefaultResponse is Block so anything that does not opt out keeps hitting trees.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=True,Name="SimCopterFoliage")

