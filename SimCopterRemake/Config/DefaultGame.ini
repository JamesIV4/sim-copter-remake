[/Script/UnrealEd.ProjectPackagingSettings]
; The ModelContextProtocol plugin loads in the cook commandlet and tries to bind its HTTP
; listener to port 8000. If the editor is open it already owns 8000, so the cook logs
; "LogHttpListener: Error: HttpListener unable to bind to 127.0.0.1:8000" -- one Error line is
; enough to make the commandlet exit 1, and UAT reports Error_UnknownCookFailure. Give the
; cooker its own port so packaging works with the editor running.
AdditionalCookerOptions=-ModelContextProtocolPort=8123

