[/Script/UnrealEd.ProjectPackagingSettings]
; The ModelContextProtocol plugin loads in the cook commandlet and tries to bind its HTTP
; listener to port 8000. If the editor is open it already owns 8000, so the cook logs
; "LogHttpListener: Error: HttpListener unable to bind to 127.0.0.1:8000" -- one Error line is
; enough to make the commandlet exit 1, and UAT reports Error_UnknownCookFailure. Give the
; cooker its own port so packaging works with the editor running.
AdditionalCookerOptions=-ModelContextProtocolPort=8123

; Both levels are opened by NAME from C++ (USimCopterSessionSubsystem::GetMainMenuLevelName /
; GetCityLevelName), so neither is a reference the cooker can follow. Without this list only
; GameDefaultMap ships: the front end comes up, and picking a city silently fails to travel and
; drops straight back to the main menu. CityRender is the whole game.
+MapsToCook=(FilePath="/Game/MainMenu")
+MapsToCook=(FilePath="/Game/CityRender")

; Same problem one level down: the baked city atlas is addressed by generated name
; (LoadObject "/Game/Generated/CityAtlas/MI_CityImage_<page>"), so nothing hard-references it.
; The city falls back to decoding BMPs at runtime when these are absent, which works but throws
; away the whole bake.
+DirectoriesToAlwaysCook=(Path="/Game/Generated/CityAtlas")

; MENUSKY.mp4 is data, not an asset, and Media Foundation opens it through the OS rather than
; through Unreal's file system - so it has to be staged loose (NonUFS). Packed into the .pak it
; is invisible to the media player, the front end falls back to stretching the 400x66
; SKYCOOL.BMP over the whole screen, and the menu backdrop turns into dithered noise.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Generated/Movies")

; "PLACE ORIGINAL in SimCopter FOLDER.txt". It has to be readable in Explorer BEFORE the game is
; ever launched, so the game creating it at startup is not good enough - it must ship. NonUFS
; keeps it a real file rather than burying it in the .pak, and the [Staging] remap below lifts it
; out to the package root. It only lives under Content/ because that is the one directory
; DirectoriesToAlwaysStageAs* can reach.
+DirectoriesToAlwaysStageAsNonUFS=(Path="SimCopter")

[Staging]
; ...and here is the lift. Staged paths under the project are "<ShortProjectName>/...", and the
; remap is applied to the whole staged file list at the end of staging (see
; CopyBuildToStagingDirectory.Automation.cs, "Apply all the directory mappings"), so it catches
; the NonUFS entry above. Result: <Package>/SimCopter/PLACE ORIGINAL in SimCopter FOLDER.txt,
; beside SimCopterRemake.exe, which is exactly where the game looks (`../SimCopter` from
; ProjectDir - see Formats/SimCopterOriginalGamePaths.h).
+RemapDirectories=(From="SimCopterRemake/Content/SimCopter", To="SimCopter")

